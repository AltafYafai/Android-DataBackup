name: Build Personal

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'source/**'
      - '.github/workflows/build-personal.yaml'
      - 'ci/**'

jobs:
  build:
    name: "Build arm64 foss release APK"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source

    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Notify Telegram (Build Started)
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python3 ../ci/telegram_notify.py start

      - name: Validate gradle wrapper
        uses: gradle/wrapper-validation-action@v1

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup gradlew
        run: chmod +x gradlew

      - name: Build with gradle
        id: gradle_build
        run: |
          set -o pipefail
          ./gradlew assembleArm64-v8aFossRelease --daemon --parallel 2>&1 | tee ../build.log build.log

      - name: Move APKs
        if: success()
        run: mv ./*/build/outputs/apk/*/release/*.apk .

      - name: Upload APKs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BackupVault-v1.0
          path: '**/*.apk'

      - name: Send APK to Telegram
        if: success()
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python3 ../ci/telegram_notify.py success

      - name: Upload build log artifact on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-log
          path: build.log
          if-no-files-found: ignore

      - name: Send Failure Notification & Build Log to Telegram
        if: failure()
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python3 ../ci/telegram_notify.py failure ../build.log
