name: Build Personal

on:
  workflow_dispatch:

jobs:
  build:
    name: "Build arm64 foss release APK"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source

    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate gradle wrapper
        uses: gradle/wrapper-validation-action@v1

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup gradlew
        run: chmod +x gradlew

      - name: Build with gradle
        run: ./gradlew assembleArm64-v8aFossRelease --daemon --parallel

      - name: Move APKs
        run: mv ./*/build/outputs/apk/*/release/*.apk .

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: PersonalAPK
          path: '**/*.apk'

      - name: Send APK to Telegram
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          if [ -z "$TG_BOT_TOKEN" ] || [ -z "$TG_CHAT_ID" ]; then
            echo "::warning::TG_BOT_TOKEN or TG_CHAT_ID not set - skipping Telegram upload"
            exit 0
          fi
          APK_FILE=$(ls -1 -- *.apk | head -n 1)
          CAPTION=$(printf 'BackupVault %s\ncommit: %s\nrun: %s/%s/actions/runs/%s\nbuilt %s' \
            "$APK_FILE" \
            "${GITHUB_SHA::7}" \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" \
            "$(date -u '+%Y-%m-%d %H:%M UTC')")
          RESPONSE=$(curl -sS --max-time 620 \
            -F chat_id="${TG_CHAT_ID}" \
            -F caption="${CAPTION}" \
            -F "document=@${APK_FILE}" \
            "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendDocument" 2>curl_err.txt) || true
          if echo "$RESPONSE" | grep -q '"ok":true'; then
            echo "Telegram upload OK: $APK_FILE"
          else
            echo "::warning::Telegram upload failed"
            echo "$RESPONSE"
            cat curl_err.txt
          fi
