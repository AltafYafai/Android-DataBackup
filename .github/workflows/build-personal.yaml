name: Build Personal

on:
  workflow_dispatch:

jobs:
  build:
    name: "Build arm64 foss debug APK"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source

    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate gradle wrapper
        uses: gradle/wrapper-validation-action@v1

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup gradle
        uses: gradle/gradle-build-action@v2

      - name: Setup gradlew
        run: chmod +x gradlew

      - name: Check build-logic
        run: ./gradlew check -p build-logic

      - name: Build with gradle
        run: ./gradlew assembleArm64-v8aFossDebug --daemon --parallel

      - name: Move APKs
        run: mv ./*/build/outputs/apk/*/debug/*.apk .

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: PersonalAPK
          path: '**/*.apk'
